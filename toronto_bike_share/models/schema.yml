version: 2
models:
  - name: stg_trips
    description: One row per raw record; rejection_reason documents the first failing rule.
    columns:
      - name: source_row_number
        data_tests: [unique, not_null]
  - name: dim_station
    description: One row per station ID with its latest nonempty name in this snapshot.
    columns:
      - name: station_id
        data_tests: [unique, not_null]
  - name: fct_trip
    description: One accepted, deduplicated trip. Invalid records remain in staging.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: started_at
        data_tests: [not_null]
      - name: ended_at
        data_tests: [not_null]
      - name: start_station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
      - name: end_station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_id
  - name: mart_daily_ridership
    description: One start date, rider type, and bike model; observed departures only.
  - name: mart_station_hour
    description: One station, event hour, rider type, and bike model with observed movements.
